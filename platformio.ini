; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
firmware_version = '{4, 0, 1}'
device_name = '"vuesp."'

[platformio]
build_dir = build

[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_src_filter = +<*> -<tests/*>
lib_deps = 
    ESP32Async/ESPAsyncWebServer@3.12.1
	paulstoffregen/OneWire@2.3.8
build_flags = 
	-D DEF_DEVICE_FIRMWARE=${common.firmware_version}
	-D DEF_DEVICE_NAME=${common.device_name}
	-D CURRENT_TIME=$UNIX_TIME
	-D DEF_BOARD=1

[env:esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_src_filter = +<*> -<tests/*>
lib_deps = 
  	ESP32Async/AsyncTCP@3.5.0
 	ESP32Async/ESPAsyncWebServer@3.12.1
	paulstoffregen/OneWire@2.3.8
build_flags = 
	-D DEF_DEVICE_FIRMWARE=${common.firmware_version}
	-D DEF_DEVICE_NAME=${common.device_name}
	-D CURRENT_TIME=$UNIX_TIME
	-D DEF_BOARD=2

[env:pico32]
platform = espressif32@7.0.1
board = pico32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_src_filter = +<*> -<tests/*>
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
  	ESP32Async/AsyncTCP@3.5.0
 	ESP32Async/ESPAsyncWebServer@3.12.1
	paulstoffregen/OneWire@2.3.8
build_flags = 
	-D DEF_DEVICE_FIRMWARE=${common.firmware_version}
	-D DEF_DEVICE_NAME=${common.device_name}
	-D CURRENT_TIME=$UNIX_TIME
	-D DEF_BOARD=2

[env:esp32-c3-devkitm-1]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_src_filter = +<*> -<tests/*>
lib_deps = 
  	ESP32Async/AsyncTCP@3.5.0
 	ESP32Async/ESPAsyncWebServer@3.12.1
	paulstoffregen/OneWire@2.3.8
build_flags = 
	-D DEF_DEVICE_FIRMWARE=${common.firmware_version}
	-D DEF_DEVICE_NAME=${common.device_name}
	-D CURRENT_TIME=$UNIX_TIME
	-D DEF_BOARD=2
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_ESP32C3_DEV=1
